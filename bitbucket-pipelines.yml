image: node:18

options:
  max-time: 20 # Optional timeout for pipeline

pipelines:
  default:
    - step:
        name: Run Tests & Coverage
        caches:
          - node
        script:
          # Install dependencies
          - npm ci

          # Run Jest tests
          # --coverage → generate code coverage
          # --runInBand → avoid parallel execution issues
          # Jest automatically exits with non-zero if any test fails
          - npm test -- --coverage --runInBand

        artifacts:
          # Store coverage report in Bitbucket artifacts
          - coverage/**
